<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>V2X Gaming Browser</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#eef4ff;font-family:Arial,sans-serif}
header,main{max-width:1000px;margin:auto;padding:20px}
h1 span{color:#65e6ff}
nav{display:flex;gap:12px;flex-wrap:wrap}
nav a,.panel,.game{background:#17243a;padding:15px;border-radius:12px}
nav a{color:#65e6ff;text-decoration:none}
.panel,.game{margin:15px 0}
input{width:100%;padding:12px;margin:7px 0;background:#080f1d;color:white;border:1px solid #456;border-radius:8px}
button{padding:12px;border:0;border-radius:8px;background:#65e6ff;color:#07111d;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.game a{color:#65e6ff}
video,iframe,audio{width:100%;margin-top:12px;border-radius:10px}
p{color:#b8c5d9}
</style>
</head>
<body>
<header>
<h1><span>V2X</span> GAMING BROWSER</h1>
<p>Your gaming and media hangout.</p>
<nav>
<a href="#games">Games</a>
<a href="#media">Media Centre</a>
<a href="#search">Search</a>
</nav>
</header>

<main>
<section class="panel" id="search">
<h2>🔎 DuckDuckGo Search</h2>
<input id="query" placeholder="Search the web...">
<button onclick="searchWeb()">Search</button>
</section>
